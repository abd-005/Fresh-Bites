name: CI Action

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:
  fresh-job:

    runs-on: ubuntu-latest

    steps:

      - name: Action started
        run: echo "CI Started"


      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20


      - name: Install Dependencies
        run: npm ci


      - name: Lint
        run: npm run lint


      - name: Build Next App
        run: npm run build


      - name: Build Docker Image
        run: docker build -t fresh-bites .
        

      - name: Action completed
        run: echo "CI completed successfully"